<main class="container">
 <main class="container">
  <section class="card">
    <h2>Join Artopia</h2>
    <form id="joinForm" aria-label="Join form">

      <!-- Full Name -->
      <label>Full Name<br>
        <input type="text" name="fullname" placeholder="Enter your full name" required>
      </label><br><br>

      <!-- Email -->
      <label>Email<br>
        <input type="email" name="email" placeholder="abc@gmail.com" required>
      </label><br><br>

      <!-- Interests -->
      <fieldset>
        <legend>Interests</legend>
        <label><input type="checkbox" name="interest" value="camping"> Camping</label>
        <label><input type="checkbox" name="interest" value="dancing"> Dancing</label>
        <label><input type="checkbox" name="interest" value="hiking"> Hiking</label>
        <label><input type="checkbox" name="interest" value="climbing"> Climbing</label>
      </fieldset><br>

      <!-- Message -->
      <label>Message<br>
        <textarea name="message" rows="4" placeholder="Write your message..."></textarea>
      </label><br><br>

      <!-- Submit Button -->
      <button class="btn" type="submit">Submit</button>
    </form>

    <!-- Note -->
    <p class="form-note">📩 You will receive a confirmation email within <strong>3 days</strong>.</p>
  </section>
</main>
